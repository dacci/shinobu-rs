[package]
name = "shinobu"
version = "0.1.0"
edition = "2021"
description = "Shinobu"

[package.metadata.bundle]
name = "Shinobu"
identifier = "org.dacci.shinobu"

[dependencies]
anyhow = "1.0.98"
cocoa = "0.26.0"
core-foundation = "0.10.0"
core-foundation-sys = "0.8.7"
env_logger = { version = "0.11.8", default-features = false, features = ["humantime"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
libc = "0.2.172"
log = "0.4.27"
objc = "0.2.7"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
